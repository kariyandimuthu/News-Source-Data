name: Build News Source Data APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/supabase-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee apk-metadata.txt
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" apk-metadata.txt || true
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Upload APK and diagnostic metadata
        uses: actions/upload-artifact@v4
        with:
          name: News-Source-Data-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-metadata.txt
            apk-sha256.txt
          if-no-files-found: error
