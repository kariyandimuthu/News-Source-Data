name: Build News Source Data APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/stock-videos-photo-ocr-tamil-translation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Never keep a private signing key in a public repository's Actions cache.
      # Main-branch APKs are published only when the dedicated signing secret is set.
      # Keep this workflow as the sole release path for signed APK artifacts.
      - name: Prepare permanent signing key
        id: permanent_signing
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
        run: |
          set -eu
          if [ -z "${SIGNING_BUNDLE_BASE64:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_SIGNING_BUNDLE_BASE64 is not set; this run will build for validation but will not publish an APK."
            exit 0
          fi

          SIGNING_DIR="$RUNNER_TEMP/news-source-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE_BASE64" | base64 --decode > "$RUNNER_TEMP/news-source-signing-bundle.zip"
          unzip -oq "$RUNNER_TEMP/news-source-signing-bundle.zip" -d "$SIGNING_DIR"
          test -f "$SIGNING_DIR/news-source-data-signing.p12"
          test -f "$SIGNING_DIR/signing.properties"

          # This bundle is generated by us and contains only alphanumeric values.
          . "$SIGNING_DIR/signing.properties"
          echo "ANDROID_SIGNING_KEYSTORE=$SIGNING_DIR/news-source-data-signing.p12" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Show permanent signing certificate fingerprint
        if: ${{ steps.permanent_signing.outputs.configured == 'true' }}
        run: keytool -list -v -storetype PKCS12 -keystore "$ANDROID_SIGNING_KEYSTORE" -storepass "$ANDROID_SIGNING_STORE_PASSWORD" -alias "$ANDROID_SIGNING_KEY_ALIAS" | grep -E 'SHA256:|SHA256 fingerprint'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.permanent_signing.outputs.configured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: News-Source-Data-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
