name: Build News Source Data APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/stock-videos-photo-ocr-tamil-translation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Restore first so a cached key is not shadowed by a newly generated runner key.
      # On a cache miss, actions/cache saves the key after the job completes.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: news-source-data-debug-signing-key-v1

      - name: Ensure Android debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show signing certificate fingerprint
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|SHA256 fingerprint'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # Only publish downloads built from main, because cache keys are branch-scoped.
      - name: Upload APK
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: News-Source-Data-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
